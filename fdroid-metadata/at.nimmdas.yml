# F-Droid packaging recipe for the Nimmdas Android app.
#
# This file is NOT used by the app build. Copy it to metadata/at.nimmdas.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request from there.
#
# Before submitting, make sure the tag named in `commit:` exists in the repository.

Categories:
  - Money
  - Internet

License: GPL-3.0-or-later

AuthorName: Nimmdas
AuthorWebSite: https://nimmdas.at

SourceCode: https://github.com/Echo-Files/nimmdas-android
IssueTracker: https://github.com/Echo-Files/nimmdas-android/issues
Changelog: https://github.com/Echo-Files/nimmdas-android/releases

AutoName: Nimmdas

RepoType: git
Repo: https://github.com/Echo-Files/nimmdas-android.git

Builds:
  - versionName: 2.1.0
    versionCode: 21
    commit: v2.1.0
    subdir: app
    gradle:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 2.1.0
CurrentVersionCode: 21

# The app is a client for the nimmdas.at service, which is not free software.
AntiFeatures:
  NonFreeNet:
    en-US: >-
      The app requires an account on nimmdas.at. The server side is proprietary.
